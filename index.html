<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + the safe-area padding in styles.css keeps content
      clear of the notch and the home indicator when running standalone.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Guitar fingerings for any chord in any tuning." />

    <!-- Installable web app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16151a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ignores the manifest and needs its own tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chords" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Chord Shapes — fingerings in any tuning</title>
    <!--
      Inlined as a data URI so there's no /favicon.ico request to 404. That
      stray 404 shows up in the console on every page load otherwise, which is
      noise that looks like a real failure when you're debugging a blank page.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4532a'/%3E%3Cg stroke='%23fff' stroke-width='1.6' opacity='.85'%3E%3Cpath d='M7 9h18M7 15h18M7 21h18'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='12' cy='12' r='2.6'/%3E%3Ccircle cx='20' cy='18' r='2.6'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
